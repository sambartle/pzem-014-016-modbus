[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pzem-014-016-modbus"
version = "0.0.0"
description = "Read PZEM-014 and PZEM-016 Modbus AC energy meters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "pzem-014-016-modbus contributors" }]
keywords = ["modbus", "pzem", "pzem-014", "pzem-016", "pzem-004t", "power-meter", "energy-meter", "ac-meter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
# The caller injects a ModbusUnit; tmodbus is the backend this is exercised against.
dependencies = ["modbus-connection[tmodbus]>=4.12.1"]

[project.urls]
Homepage = "https://github.com/sambartle/pzem-014-016-modbus"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pzem_014_016_modbus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
# D401 wants imperative docstrings; this codebase names things ("The voltage
# the meter reads"), matching modbus-connection's own style. D107 is covered
# by the class docstring.
ignore = ["D107", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "script"]
strict = true

[tool.ruff.lint.per-file-ignores]
# A test's name is its documentation; docstrings are for the ones that need a why.
"tests/*" = ["D100", "D103", "D104"]
